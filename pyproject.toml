[project]
name = "recordrelay"
version = "3.0.0"
description = "Universal database record transfer across environments"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6.0",
    "psycopg2-binary>=2.9.0",
    "cryptography>=42.0.0",
    "PyMySQL>=1.1.0",
    "typer>=0.12.0",
]

[project.scripts]
recordrelay = "cli:app"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
build = ["pyinstaller>=6.0.0"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
