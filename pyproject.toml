[project]
name = "beyanname-transfer"
version = "2.0.0"
description = "Ortamlar arası güvenli beyanname veri aktarım aracı"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6.0",
    "psycopg2-binary>=2.9.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
build = ["pyinstaller>=6.0.0"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
