name: Release

# Bir sürüm etiketi (ör. v2.0.0) push edilince çalışır.
# Üç işletim sistemi için paketler ve GitHub Release'e yükler.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:        # gerekirse elle de tetiklenebilir

permissions:
  contents: write           # Release oluşturmak için

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BeyannameTransfer-windows
            ext: ".exe"
            asset: BeyannameTransfer.exe
          - os: macos-latest
            artifact: BeyannameTransfer-macos
            ext: ".app"
            asset: BeyannameTransfer.app
          - os: ubuntu-latest
            artifact: BeyannameTransfer-linux
            ext: ""
            asset: BeyannameTransfer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux sistem bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r build-requirements.txt

      - name: Paketle
        run: pyinstaller --noconfirm build.spec

      - name: Arşivle (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path BeyannameTransfer.exe -DestinationPath ../${{ matrix.artifact }}.zip

      - name: Arşivle (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }}.zip BeyannameTransfer.app

      - name: Arşivle (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          chmod +x BeyannameTransfer
          tar czf ../${{ matrix.artifact }}.tar.gz BeyannameTransfer

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    name: Release yayınla
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Tüm artifactları indir
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          name: "Beyanname Transfer ${{ github.ref_name }}"
          body: |
            ## Beyanname Transfer ${{ github.ref_name }}

            İşletim sisteminize uygun dosyayı indirin:

            | İşletim Sistemi | Dosya |
            |---|---|
            | 🪟 Windows | `BeyannameTransfer-windows.zip` |
            | 🍎 macOS | `BeyannameTransfer-macos.zip` |
            | 🐧 Linux | `BeyannameTransfer-linux.tar.gz` |

            Arşivi açıp uygulamayı çalıştırın. Kurulum gerekmez.

            > **Not:** İlk açılışta Windows SmartScreen veya macOS Gatekeeper
            > uyarı verebilir (imzasız uygulama). "Yine de çalıştır" ile geçebilirsiniz.
