name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RecordRelay-windows
            archive_cmd: zip
          - os: macos-latest
            artifact: RecordRelay-macos
            archive_cmd: zip
          - os: ubuntu-latest
            artifact: RecordRelay-linux
            archive_cmd: tar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r build-requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm build.spec

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path RecordRelay.exe -DestinationPath ../RecordRelay-windows.zip

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../RecordRelay-macos.zip RecordRelay.app

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          chmod +x RecordRelay
          tar czf ../RecordRelay-linux.tar.gz RecordRelay

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            RecordRelay-windows.zip
            RecordRelay-macos.zip
            RecordRelay-linux.tar.gz
          if-no-files-found: ignore

  build-plugin:
    name: IntelliJ Plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build plugin
        working-directory: plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin compatibility
        working-directory: plugin
        run: ./gradlew verifyPlugin --no-daemon
        continue-on-error: true   # verification warnings shouldn't block release

      - name: Publish to JetBrains Marketplace
        if: env.PUBLISH_TOKEN != ''
        working-directory: plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JB_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JB_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JB_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JB_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin publishPlugin --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: recordrelay-plugin
          path: plugin/build/distributions/recordrelay-plugin-*.zip

  release:
    name: Publish Release
    needs: [build-desktop, build-plugin]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA-256 checksums
        run: |
          find artifacts -type f | sort | while read f; do
            sha256sum "$f" | awk '{print $1, "  " $2}'
          done > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            checksums.txt
          name: "RecordRelay ${{ github.ref_name }}"
          body: |
            ## RecordRelay ${{ github.ref_name }}

            Universal database record transfer across environments — desktop app, IntelliJ plugin, and CLI.

            ### Desktop App

            Download the binary for your OS, extract, and run. No installation required.

            | OS | File |
            |---|---|
            | 🪟 Windows | `RecordRelay-windows.zip` |
            | 🍎 macOS | `RecordRelay-macos.zip` |
            | 🐧 Linux | `RecordRelay-linux.tar.gz` |

            > First launch on Windows or macOS may show an unsigned-app warning. Click "Run anyway" / "Open anyway".

            ### IntelliJ Plugin

            Install `recordrelay-plugin-${{ github.ref_name }}.zip` via `Settings → Plugins → Install from Disk`.
            Works in IntelliJ IDEA, PyCharm, WebStorm, DataGrip (2024.1+).

            ### Verify downloads

            Compare file hashes against `checksums.txt` before running.

            ---
            **Full changelog:** https://github.com/MstroCA/recordrelay/commits/${{ github.ref_name }}
